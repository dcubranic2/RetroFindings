<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 540" role="img" aria-label="Windows is one VM among many on the 32-bit VMM" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">Windows is one VM among many on the 32-bit VMM</text><g><rect x="24" y="56" width="440" height="228" rx="8" fill="#f1efe8" stroke="#73726c" stroke-width="1.25"></rect><text x="40" y="80" font-weight="600" fill="#1f1e1d">System VM · 16-bit protected mode, ring 3</text></g><g><rect x="40" y="92" width="408" height="40" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="244" y="116" text-anchor="middle" fill="#1f1e1d">Windows applications · cooperative, one shared LDT</text></g><g><rect x="40" y="148" width="124" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="102" y="172" text-anchor="middle" font-weight="600" fill="#1f1e1d">KERNEL</text><text x="102" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">KRNL386.EXE</text></g><g><rect x="182" y="148" width="124" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="244" y="172" text-anchor="middle" font-weight="600" fill="#1f1e1d">USER</text><text x="244" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">USER.EXE</text></g><g><rect x="324" y="148" width="124" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="386" y="172" text-anchor="middle" font-weight="600" fill="#1f1e1d">GDI</text><text x="386" y="190" text-anchor="middle" font-size="11.5" fill="#5f5e5a">GDI.EXE</text></g><g><rect x="40" y="216" width="408" height="52" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="244" y="238" text-anchor="middle" font-weight="600" fill="#1f1e1d">Windows drivers (.DRV)</text><text x="244" y="256" text-anchor="middle" font-size="11.5" fill="#5f5e5a">display, keyboard, mouse, comm, sound, timer</text></g><g><rect x="488" y="56" width="248" height="100" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="612" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1d">DOS VM 1</text><text x="612" y="100" text-anchor="middle" font-size="11.5" fill="#5f5e5a">V86 mode, own 1 MB address space</text><text x="612" y="118" text-anchor="middle" font-size="11.5" fill="#5f5e5a">one DOS program, PIF settings</text></g><g><rect x="488" y="184" width="248" height="100" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="612" y="208" text-anchor="middle" font-weight="600" fill="#1f1e1d">DOS VM 2 … n</text><text x="612" y="228" text-anchor="middle" font-size="11.5" fill="#5f5e5a">V86 mode, preemptively scheduled</text><text x="612" y="246" text-anchor="middle" font-size="11.5" fill="#5f5e5a">windowed or full screen</text></g><g><rect x="24" y="308" width="712" height="64" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="380" y="334" text-anchor="middle" font-weight="600" fill="#1f1e1d">VMM + VxDs (WIN386.EXE)</text><text x="380" y="354" text-anchor="middle" font-size="11.5" fill="#1f1e1d">32-bit flat, ring 0: scheduler, paging, faults, virtual devices</text></g><g><rect x="24" y="396" width="712" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="380" y="420" text-anchor="middle" font-weight="600" fill="#1f1e1d">MS-DOS, BIOS and CONFIG.SYS drivers</text><text x="380" y="438" text-anchor="middle" font-size="11.5" fill="#5f5e5a">loaded before Windows; global to every VM, run in V86 mode</text></g><g><rect x="24" y="476" width="712" height="40" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="380" y="500" text-anchor="middle" fill="#1f1e1d">Intel 80386 or later: CPU, memory, devices</text></g></svg>
