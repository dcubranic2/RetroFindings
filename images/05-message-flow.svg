<svg xmlns="http://www.w3.org/2000/svg" width="760" height="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 324" role="img" aria-label="Windows switches tasks only while a program waits in GetMessage" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="msg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#73726c"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">Windows switches tasks only while a program waits in GetMessage</text><g fill="none" stroke="#73726c" stroke-width="1.25"><path d="M184 104H206" marker-end="url(#msg-arrow)"></path><path d="M368 104H390" marker-end="url(#msg-arrow)"></path><path d="M552 104H574" marker-end="url(#msg-arrow)"></path><path d="M656 132V194" marker-end="url(#msg-arrow)"></path><path d="M576 224H554" marker-end="url(#msg-arrow)"></path><path d="M392 224H370" marker-end="url(#msg-arrow)"></path><path d="M288 252V284H616V254" marker-end="url(#msg-arrow)"></path></g><g><rect x="24" y="76" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="104" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Keyboard, mouse</text><text x="104" y="118" text-anchor="middle" font-size="11.5" fill="#5f5e5a">hardware interrupt</text></g><g><rect x="208" y="76" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="288" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Input drivers</text><text x="288" y="118" text-anchor="middle" font-size="11.5" fill="#5f5e5a">KEYBOARD/MOUSE.DRV</text></g><g><rect x="392" y="76" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="472" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">System queue</text><text x="472" y="118" text-anchor="middle" font-size="11.5" fill="#5f5e5a">one, kept by USER</text></g><g><rect x="576" y="76" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="656" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Task queue</text><text x="656" y="118" text-anchor="middle" font-size="11.5" fill="#5f5e5a">one per program</text></g><g><rect x="576" y="196" width="160" height="56" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="656" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1d">GetMessage</text><text x="656" y="238" text-anchor="middle" font-size="11.5" fill="#1f1e1d">waits; other tasks run</text></g><g><rect x="392" y="196" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="472" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1d">DispatchMessage</text><text x="472" y="238" text-anchor="middle" font-size="11.5" fill="#5f5e5a">after TranslateMessage</text></g><g><rect x="208" y="196" width="160" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="288" y="220" text-anchor="middle" font-weight="600" fill="#1f1e1d">Window procedure</text><text x="288" y="238" text-anchor="middle" font-size="11.5" fill="#5f5e5a">handles one message</text></g><text x="452" y="302" text-anchor="middle" font-size="11.5" fill="#5f5e5a">returns, then asks for the next message</text></svg>
