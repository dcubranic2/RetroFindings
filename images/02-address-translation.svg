<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 272" role="img" aria-label="A far pointer becomes a physical address in two steps" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="xlat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#73726c"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">A far pointer becomes a physical address in two steps</text><g fill="none" stroke="#73726c" stroke-width="1.25"><path d="M176 106H206" marker-end="url(#xlat-arrow)"></path><path d="M360 106H390" marker-end="url(#xlat-arrow)"></path><path d="M544 106H574" marker-end="url(#xlat-arrow)"></path><path d="M600 142V166H436V188" marker-end="url(#xlat-arrow)"></path><path d="M680 142V188" marker-end="url(#xlat-arrow)"></path></g><g><rect x="24" y="70" width="152" height="72" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="100" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">Far pointer</text><text x="100" y="112" text-anchor="middle" font-size="11.5" fill="#5f5e5a">selector : offset</text><text x="100" y="128" text-anchor="middle" font-size="11.5" fill="#5f5e5a">16 bits : 16 bits</text></g><g><rect x="208" y="70" width="152" height="72" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="284" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">LDT descriptor</text><text x="284" y="112" text-anchor="middle" font-size="11.5" fill="#5f5e5a">base, limit, rights</text><text x="284" y="128" text-anchor="middle" font-size="11.5" fill="#5f5e5a">8,192 shared slots</text></g><g><rect x="392" y="70" width="152" height="72" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="468" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">Linear address</text><text x="468" y="112" text-anchor="middle" font-size="11.5" fill="#5f5e5a">base + offset</text><text x="468" y="128" text-anchor="middle" font-size="11.5" fill="#5f5e5a">32-bit, up to 4 GB</text></g><g><rect x="576" y="70" width="152" height="72" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="652" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">Page tables</text><text x="652" y="112" text-anchor="middle" font-size="11.5" fill="#1f1e1d">4 KB pages</text><text x="652" y="128" text-anchor="middle" font-size="11.5" fill="#1f1e1d">386 Enhanced mode only</text></g><g><rect x="344" y="190" width="184" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="436" y="214" text-anchor="middle" font-weight="600" fill="#1f1e1d">Physical RAM</text><text x="436" y="232" text-anchor="middle" font-size="11.5" fill="#5f5e5a">page present</text></g><g><rect x="552" y="190" width="184" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="644" y="214" text-anchor="middle" font-weight="600" fill="#1f1e1d">Swap file</text><text x="644" y="232" text-anchor="middle" font-size="11.5" fill="#5f5e5a">page fault: load from disk</text></g></svg>
