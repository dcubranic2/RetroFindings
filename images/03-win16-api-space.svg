<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 480" role="img" aria-label="Applications call a thin stack of 16-bit DLLs over DOS" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#73726c"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">Applications call a thin stack of 16-bit DLLs over DOS</text><g fill="none" stroke="#73726c" stroke-width="1.25"><path d="M196 100V126" marker-end="url(#api-arrow)"></path><path d="M564 100V126" marker-end="url(#api-arrow)"></path><path d="M134 212V234" marker-end="url(#api-arrow)"></path><path d="M380 212V234" marker-end="url(#api-arrow)"></path><path d="M626 212V234" marker-end="url(#api-arrow)"></path><path d="M134 308V330" marker-end="url(#api-arrow)"></path><path d="M380 308V330" marker-end="url(#api-arrow)"></path><path d="M626 308V330" marker-end="url(#api-arrow)"></path><path d="M380 388V410" marker-end="url(#api-arrow)"></path></g><g><rect x="24" y="56" width="344" height="44" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="196" y="82" text-anchor="middle" font-weight="600" fill="#1f1e1d">Windows applications (.EXE)</text></g><g><rect x="392" y="56" width="344" height="44" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="564" y="82" text-anchor="middle" fill="#1f1e1d">Win32s programs, thunked to Win16</text></g><g><rect x="24" y="128" width="712" height="84" rx="8" fill="#f1efe8" stroke="#73726c" stroke-width="1.25"></rect><text x="40" y="152" font-weight="600" fill="#1f1e1d">System DLLs</text><rect x="40" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="126" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="212" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="298" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="384" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="470" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="556" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><rect x="642" y="164" width="78" height="32" rx="6" fill="none" stroke="#73726c" stroke-width="1"></rect><text x="79" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">COMMDLG</text><text x="165" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">SHELL</text><text x="251" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">DDEML</text><text x="337" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">OLECLI/SVR</text><text x="423" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">MMSYSTEM</text><text x="509" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">TOOLHELP</text><text x="595" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">VER</text><text x="681" y="184" text-anchor="middle" font-size="11.5" fill="#1f1e1d">LZEXPAND</text></g><g><rect x="24" y="236" width="220" height="72" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="134" y="260" text-anchor="middle" font-weight="600" fill="#1f1e1d">KERNEL</text><text x="134" y="278" text-anchor="middle" font-size="11.5" fill="#1f1e1d">memory, tasks, modules,</text><text x="134" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">resources, files, INI profiles</text></g><g><rect x="270" y="236" width="220" height="72" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="380" y="260" text-anchor="middle" font-weight="600" fill="#1f1e1d">USER</text><text x="380" y="278" text-anchor="middle" font-size="11.5" fill="#1f1e1d">windows, messages, input,</text><text x="380" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">menus, dialogs, controls</text></g><g><rect x="516" y="236" width="220" height="72" rx="8" fill="#2563c9" fill-opacity="0.12" stroke="#2563c9" stroke-width="2"></rect><text x="626" y="260" text-anchor="middle" font-weight="600" fill="#1f1e1d">GDI</text><text x="626" y="278" text-anchor="middle" font-size="11.5" fill="#1f1e1d">device contexts, drawing,</text><text x="626" y="294" text-anchor="middle" font-size="11.5" fill="#1f1e1d">fonts, bitmaps, printing</text></g><g><rect x="24" y="332" width="712" height="56" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="380" y="356" text-anchor="middle" font-weight="600" fill="#1f1e1d">Windows drivers (.DRV)</text><text x="380" y="374" text-anchor="middle" font-size="11.5" fill="#5f5e5a">display, printer, keyboard, mouse, comm, sound, system timer</text></g><g><rect x="24" y="412" width="712" height="44" rx="8" fill="none" stroke="#73726c" stroke-width="1.25"></rect><text x="380" y="438" text-anchor="middle" fill="#1f1e1d">MS-DOS and BIOS: every file operation ends in INT 21h</text></g></svg>
